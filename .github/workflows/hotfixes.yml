# Cada semana mira si los artículos de hotfixes de Blizzard tienen fechas más nuevas que los datos de clases, raids y Míticas+.
# Si las hay, abre un issue con el texto de esos días; no modifica nada solo.
name: Hotfixes de clases y raids

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - id: run
        run: |
          node tools/check-hotfixes.mjs > hotfixes.json
          cat hotfixes.json
          echo "dates=$(jq -r '.newDates | join(", ")' hotfixes.json)" >> "$GITHUB_OUTPUT"
      - name: Abrir un issue si hay fechas nuevas
        if: steps.run.outputs.dates != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Hotfixes nuevos de Blizzard: ${{ steps.run.outputs.dates }}"
          if [ -n "$(gh issue list --state all --search "\"$title\" in:title" --json number --jq '.[0].number')" ]; then
            echo "Ya hay un issue para estas fechas."
            exit 0
          fi
          { echo "Los artículos de hotfixes de Blizzard tienen fechas más nuevas que los datos de la app (clases hasta $(jq -r .latestClasses hotfixes.json), raids y Míticas+ hasta $(jq -r .latestRaids hotfixes.json))."; echo; echo "Sigue tools/raidchanges/FLUJO.md para añadirlos (español e inglés)."; echo; echo '### Clases'; echo '```'; jq -r .classText hotfixes.json; echo '```'; echo; echo '### Raids y Míticas+'; echo '```'; jq -r .raidText hotfixes.json; echo '```'; } > body.md
          gh issue create --title "$title" --body-file body.md
